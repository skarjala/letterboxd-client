[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "letterboxd-client"
version = "0.1.0"
description = "High-level Python SDK for Letterboxd ingestion, exports, and analysis workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sandeep Karjala" }
]
dependencies = [
  "httpx>=0.27,<1",
]
keywords = ["letterboxd", "sdk", "llm", "analytics", "data-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dataframes = [
  "pandas>=2",
  "polars>=1",
  "pyarrow>=15",
]

[tool.setuptools]
packages = ["letterboxd_client"]

